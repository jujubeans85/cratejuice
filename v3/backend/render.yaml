services:
  - type: web
    name: cratejuice-backend
    env: python
    region: oregon
    plan: free
    # Install OS packages required by Pillow/orjson, then install Python deps
    buildCommand: apt-get update && apt-get install -y build-essential libjpeg-dev zlib1g-dev gcc && pip install -r requirements.txt
    # Use gunicorn with Uvicorn worker for ASGI compatibility
    startCommand: gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: FRONTEND_URL
        value: https://rococo-syrniki-9fc4e3.netlify.app
